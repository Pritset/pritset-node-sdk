name: Production test lifecycle

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: pritset-node-sdk-production-test
  cancel-in-progress: false

jobs:
  lifecycle:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production-test
    env:
      PRITSET_BASE_URL: https://api.pritset.com
      PRITSET_ACCESS_TOKEN: ${{ secrets.PRITSET_ACCESS_TOKEN }}
      PRITSET_SECRET: ${{ secrets.PRITSET_SECRET }}
      PRITSET_WEBHOOK_URL: ${{ secrets.PRITSET_WEBHOOK_URL }}
      PRITSET_ALLOW_PRODUCTION: "true"
      PRITSET_PRODUCTION_TEST_USER_CONFIRMED: ${{ vars.PRITSET_PRODUCTION_TEST_USER_CONFIRMED }}
      PRITSET_TEST_RUN_PREFIX: pritset-node-production-test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run production:test
